<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab notes — DUM-E Labs</title>
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="icon" type="image/png" href="brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <!-- GitHub Dark Markdown CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.min.css">
  
  <!-- Highlight.js Syntax Highlighting Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #050505;
      color: #d9d4cb;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    /* Brand bar */
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px clamp(16px, 4vw, 40px);
      background: rgba(5,5,5,0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(236,232,225,0.12);
    }
    .bar a { color: #ece8e1; text-decoration: none; }
    .bar__brand { display: flex; align-items: center; gap: 10px; font-family: "Montserrat", sans-serif; font-weight: 500; letter-spacing: 0.16em; font-size: 14px; }
    .bar__brand img { width: 28px; height: 28px; border-radius: 6px; }
    .bar__brand b { font-weight: 400; }
    .bar__back {
      font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid rgba(236,232,225,0.25); border-radius: 99px; padding: 8px 14px;
    }
    .bar__back:hover { border-color: #ece8e1; }
    /* Centered Container */
    #page-container {
      width: 100%;
      max-width: 920px;
      padding: 40px 24px;
      margin: 0 auto;
    }
    @media (max-width: 767px) {
      #page-container {
        padding: 20px 14px;
      }
    }
    .markdown-body {
      background-color: #050505;
      --color-canvas-default: #050505;
      --color-canvas-subtle: #0d0d0c;
      --color-border-default: rgba(236,232,225,0.14);
      --color-border-muted: rgba(236,232,225,0.1);
      --color-fg-default: #d9d4cb;
      --color-accent-fg: #ece8e1;
    }
    .markdown-body a { color: #ece8e1; text-decoration: underline; text-decoration-color: rgba(236,232,225,0.35); text-underline-offset: 3px; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-family: "Montserrat", sans-serif; font-weight: 500; color: #ece8e1; }
    .markdown-body table tr { background-color: #050505; }
    .markdown-body table tr:nth-child(2n) { background-color: #0d0d0c; }
    /* Mermaid diagram container alignment and styling */
    .mermaid-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px auto;
      background: #0d0d0c;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid rgba(236,232,225,0.14);
      overflow-x: auto;
    }
    .mermaid-wrapper svg {
      max-width: 100%;
      height: auto;
    }
    .mermaid { width: 100%; display: flex; justify-content: center; }
    #loading {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.1rem;
      color: #8b949e;
    }
    /* Local file upload fallback button if opened via file:// */
    .local-fallback {
      background: #161b22;
      border: 1px dashed #30363d;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      margin: 40px auto;
    }
    .btn-file {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #238636;
      color: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-file:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>

  <header class="bar">
    <a class="bar__brand" href="index.html"><img src="brand/favicon.svg" alt="">DUM-E <b>LABS</b></a>
    <a class="bar__back" href="index.html">← Back to site</a>
  </header>

  <div id="page-container">
    <div id="content" class="markdown-body">
      <div id="loading">Loading DUM-E Labs lab notes…</div>
    </div>
  </div>

  <!-- Marked Markdown Parser (pinned: renderer.code(code, lang) + highlight option API) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <!-- Highlight.js Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <!-- Mermaid Diagram Engine -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <script>
    // 1. Initialize Mermaid Engine with Dark Theme
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      securityLevel: 'strict',
      themeVariables: {
        darkMode: true,
        background: '#0d0d0c',
        primaryColor: '#121211',
        primaryBorderColor: '#ece8e1',
        primaryTextColor: '#ece8e1',
        secondaryColor: '#121211',
        tertiaryColor: '#0d0d0c',
        lineColor: '#a29e96',
        textColor: '#ece8e1',
        clusterBkg: '#0a0a0a',
        clusterBorder: 'rgba(236,232,225,0.3)',
        fontFamily: 'Montserrat, Segoe UI, sans-serif'
      }
    });

    // 2. Custom Marked Renderer for Mermaid Code Blocks
    const renderer = new marked.Renderer();
    const defaultCodeRenderer = renderer.code.bind(renderer);

    renderer.code = function(code, language, escaped) {
      if (language === 'mermaid') {
        return `<div class="mermaid-wrapper"><div class="mermaid">${code}</div></div>`;
      }
      return defaultCodeRenderer(code, language, escaped);
    };

    marked.setOptions({
      renderer: renderer,
      gfm: true,
      breaks: false,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    function renderMarkdown(markdownText) {
      // Fix relative image paths in profile/README.md so root index.html loads them from profile/
      markdownText = markdownText.replace(/src=["'](?!http|\/|profile\/)([^"']+)["']/g, 'src="profile/$1"');
      markdownText = markdownText.replace(/!\[([^\]]*)\]\((?!http|\/|profile\/)([^)]+)\)/g, '![$1](profile/$2)');

      // Render Markdown HTML
      document.getElementById('content').innerHTML = marked.parse(markdownText);
      
      // Render Mermaid diagrams once the label font is loaded (mermaid sizes boxes from measured text)
      const runMermaid = () => mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
      const fontReady = document.fonts && document.fonts.load
        ? document.fonts.load('16px "Montserrat"').catch(() => {})
        : Promise.resolve();
      fontReady.then(() => setTimeout(runMermaid, 30));
    }

    // 3. Try fetching profile/README.md (Works on GitHub Pages & Local Servers)
    fetch('profile/README.md')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.text();
      })
      .then(markdown => {
        renderMarkdown(markdown);
      })
      .catch(error => {
        // If opened locally via file:// protocol where fetch is blocked by CORS
        if (window.location.protocol === 'file:') {
          document.getElementById('content').innerHTML = `
            <div class="local-fallback">
              <h3>📂 Local File Protocol Notice</h3>
              <p>You opened <code>index.html</code> directly via <code>file://</code> protocol, so your browser blocked fetching <code>profile/README.md</code> for security reasons.</p>
              <p><strong>Option 1:</strong> Select your <code>profile/README.md</code> file below to view it locally with all tables & rendering:</p>
              <label class="btn-file">
                Choose profile/README.md
                <input type="file" id="file-input" accept=".md" style="display:none;">
              </label>
              <p style="margin-top:20px; font-size:0.85rem; color:#8b949e;"><strong>Option 2:</strong> Once pushed to <strong>GitHub Pages</strong>, it will load <code>profile/README.md</code> automatically without any clicks!</p>
            </div>
          `;
          document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function(evt) {
                renderMarkdown(evt.target.result);
              };
              reader.readAsText(file);
            }
          });
        } else {
          document.getElementById('content').innerHTML = `
            <div style="padding: 20px; border: 1px solid #f85149; border-radius: 6px; background: rgba(248,81,73,0.1); color: #f85149;">
              <h3>Failed to load profile/README.md</h3>
              <p>${error.message}</p>
            </div>
          `;
        }
      });
  </script>
</body>
</html>
